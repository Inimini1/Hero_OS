<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d1a" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- iOS "Add to Home Screen" -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rocket Rascal" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <title>Rocket Rascal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0d0d1a;
      touch-action: none;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      /* iOS safe area */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #game-canvas {
      display: block;
      flex-shrink: 0;
      image-rendering: pixelated;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d1a;
      color: #fff;
      font-family: monospace;
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      z-index: 999;
    }
    /* Rotate hint shown when in portrait */
    #rotate-hint {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d0d1a;
      color: #fff;
      font-family: monospace;
      font-size: 1.1rem;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      z-index: 1000;
    }
    #rotate-hint svg { width: 56px; height: 56px; fill: #4477ff; }
    @media (orientation: portrait) {
      #rotate-hint { display: flex; }
    }
  </style>
</head>
<body>
  <div id="loading">ROCKET RASCAL</div>
  <div id="rotate-hint">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.55C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zm-6.25-.77L6.42 5.56 3.6 2.73C1.4 4.95 0 8.11 0 11.63c0 6.29 4.84 11.44 11 11.94v-1.55c-5.3-.49-9.45-4.94-9.45-10.39 0-3.08 1.3-5.84 3.37-7.78l2.83 2.83 3.47-3.48V1.75zm4.9 11.49L12 15.95l-3.13-1.73V9.47h1v4.11l2.13 1.19 2.13-1.19V9.47h1v3.78zM12 7h-2V5h2v2z"/>
    </svg>
    <span>Rotate your phone to landscape</span>
  </div>
  <canvas id="game-canvas"></canvas>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
